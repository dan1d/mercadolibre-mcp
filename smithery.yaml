startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      mercadolibreAccessToken:
        type: string
        title: MercadoLibre Access Token
        description: MercadoLibre access token. Required for every tool except get_category (MercadoLibre returns 403/401 anonymously). Create a free app at https://developers.mercadolibre.com.
  commandFunction:
    |-
    (config) => ({
      command: "npx",
      args: ["-y", "@dan1d/mercadolibre-mcp"],
      env: {
        ...(config.mercadolibreAccessToken ? { MERCADOLIBRE_ACCESS_TOKEN: config.mercadolibreAccessToken } : {})
      }
    })
